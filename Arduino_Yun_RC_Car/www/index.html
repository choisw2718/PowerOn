    <h1>PowerOn · Arduino Uno R3</h1>
    <p><strong>이 페이지는 차량을 제어하지 않습니다.</strong></p>
    <p>일반 Arduino Uno R3에는 Yún의 Linux/Bridge 웹 서버가 없습니다. 이전 Yún용 웹 조종 코드는 안전을 위해 제거했으며, 현재 차량은 USB 시리얼 <code>115200 baud</code>로만 제어합니다.</p>
    <p>배선, 업로드 방법, 명령과 최초 시험 순서는 상위 폴더의 <code>README_KO.md</code>를 확인하세요.</p>
